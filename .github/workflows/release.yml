name: Release BackDoor AI

on:
  push:
    tags:
      - 'v*' # Trigger build on tags like v1.0.0, v1.1.0, etc.

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backdoor-ai-ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backdoor-ai-be -> target

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev libasound2-dev

      - name: Install UI Dependencies
        run: |
          cd backdoor-ai-ui
          npm install

      - name: Install CLI Dependencies
        run: |
          cd backdoor-ai-be
          npm install

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'backdoor-ai-be'
          args: ${{ matrix.args }}

      - name: Rename and Prepare Assets (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p dist
          mv backdoor-ai-be/src-tauri/target/release/bundle/dmg/*.dmg dist/BackDoor.AI_latest_universal.dmg

      - name: Rename and Prepare Assets (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p dist
          mv backdoor-ai-be/src-tauri/target/release/bundle/deb/*.deb dist/backdoor-ai_latest_amd64.deb

      - name: Rename and Prepare Assets (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Move-Item -Path backdoor-ai-be/src-tauri/target/release/bundle/nsis/*.exe -Destination dist/BackDoor.AI_latest_x64-setup.exe

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 'BackDoor AI ${{ github.ref_name }}'
          body: 'Privacy-first live interview assistant. Please select the installer matching your OS below.'
          draft: true
          prerelease: false
          files: dist/*
